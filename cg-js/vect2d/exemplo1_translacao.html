<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 1: Translação</title>
<style>
  body { font-family: sans-serif; background: #222; color: #eee; display: flex; flex-direction: column; align-items: center; }
  canvas { background: white; margin-top: 20px; border: 1px solid #555; }
  .controls { margin-top: 12px; display: flex; gap: 24px; }
  .controls label { display: flex; flex-direction: column; font-size: 14px; }
</style>
</head>
<body>

<h2>Exemplo 1: Translação</h2>
<canvas id="canvas" width="600" height="400"></canvas>

<div class="controls">
  <label>Tx: <span id="txValue">0</span>
    <input type="range" id="tx" min="-150" max="150" value="0">
  </label>
  <label>Ty: <span id="tyValue">0</span>
    <input type="range" id="ty" min="-150" max="150" value="0">
  </label>
</div>

<script>
// --- Ponto e transformação (idênticos à página teórica/prática da wiki) ---

class Point2D {
  constructor(x, y) {
    this.x = x;
    this.y = y;
  }
}

function translate(points, tx, ty) {
  for (const p of points) {
    p.x += tx;
    p.y += ty;
  }
}

// --- Desenho ---

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const original = [
  new Point2D(200, 250),
  new Point2D(300, 150),
  new Point2D(400, 250),
];

function drawPolygon(points, color) {
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function render() {
  const tx = Number(txInput.value);
  const ty = Number(tyInput.value);
  txValue.textContent = tx;
  tyValue.textContent = ty;

  const translated = original.map((p) => new Point2D(p.x, p.y));
  translate(translated, tx, ty);

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawPolygon(original, "#bbb");     // triângulo original, referência
  drawPolygon(translated, "#e63946"); // triângulo transladado
}

const txInput = document.getElementById("tx");
const tyInput = document.getElementById("ty");
const txValue = document.getElementById("txValue");
const tyValue = document.getElementById("tyValue");

txInput.addEventListener("input", render);
tyInput.addEventListener("input", render);

render();
</script>

</body>
</html>
