<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 1: Nuvem de Estrelas</title>
<style>
  body { margin: 0; overflow: hidden; background: #050510; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// --- Geometria de pontos: um array "achatado" de posições (x, y, z por partícula) ---
const quantidade = 2000;
const posicoes = new Float32Array(quantidade * 3);

for (let i = 0; i < quantidade; i++) {
  posicoes[i * 3 + 0] = (Math.random() - 0.5) * 20; // x, entre -10 e 10
  posicoes[i * 3 + 1] = (Math.random() - 0.5) * 20; // y
  posicoes[i * 3 + 2] = (Math.random() - 0.5) * 20; // z
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(posicoes, 3));

const material = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 0.08,
  sizeAttenuation: true, // partículas mais distantes ficam menores (perspectiva)
});

const stars = new THREE.Points(geometry, material);
scene.add(stars);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  stars.rotation.y += 0.0005; // gira a nuvem toda bem devagar
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
