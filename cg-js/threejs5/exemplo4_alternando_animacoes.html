<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 4: Alternando entre Animações</title>
<style>
  body { margin: 0; overflow: hidden; background: #223344; font-family: sans-serif; }
  #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; }
  button { margin-right: 6px; padding: 6px 12px; cursor: pointer; }
  button.ativo { background: #66ccff; font-weight: bold; }
</style>
</head>
<body>

<div id="ui">
  <div id="status">Carregando modelo...</div>
  <div id="botoes" style="margin-top: 8px; display: none;">
    <button data-nome="Survey" class="ativo">Parado</button>
    <button data-nome="Walk">Andar</button>
    <button data-nome="Run">Correr</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x223344);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(3, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.5, 0);

const chao = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x334455 })
);
chao.rotation.x = -Math.PI / 2;
scene.add(chao);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const luzSol = new THREE.DirectionalLight(0xffffff, 2.0);
luzSol.position.set(3, 5, 2);
scene.add(luzSol);

const loader = new GLTFLoader();
const status = document.getElementById("status");
const botoesDiv = document.getElementById("botoes");

let mixer = null;
const acoes = {};   // um dicionário: nome da animação -> AnimationAction
let acaoAtual = null;
const clock = new THREE.Clock();

loader.load(
  "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets/Models/Fox/glTF-Binary/Fox.glb",
  (gltf) => {
    const modelo = gltf.scene;

    const caixa = new THREE.Box3().setFromObject(modelo);
    const tamanho = caixa.getSize(new THREE.Vector3());
    const maiorDimensao = Math.max(tamanho.x, tamanho.y, tamanho.z);
    modelo.scale.setScalar(2 / maiorDimensao);

    const caixaEscalada = new THREE.Box3().setFromObject(modelo);
    const centro = caixaEscalada.getCenter(new THREE.Vector3());
    modelo.position.x -= centro.x;
    modelo.position.z -= centro.z;
    modelo.position.y -= caixaEscalada.min.y;

    scene.add(modelo);

    mixer = new THREE.AnimationMixer(modelo);

    // Criamos UMA AnimationAction para cada clipe, mas só damos "play"
    // na primeira. As outras ficam prontas, esperando serem chamadas.
    gltf.animations.forEach((clip) => {
      acoes[clip.name] = mixer.clipAction(clip);
    });

    acaoAtual = acoes["Survey"];
    acaoAtual.play();

    status.style.display = "none";
    botoesDiv.style.display = "block";
  },
  undefined,
  (erro) => {
    console.error("Erro ao carregar o modelo:", erro);
    status.textContent = "Erro ao carregar o modelo (veja o console).";
  }
);

// --- Troca de animação, com transição suave (crossfade) ---
function trocarAnimacao(nome) {
  const novaAcao = acoes[nome];
  if (!novaAcao || novaAcao === acaoAtual) return;

  // .reset() garante que a nova animação comece do início
  novaAcao.reset().play();

  // .crossFadeTo mistura gradualmente a ação atual com a nova, ao longo
  // de 0.4 segundo, em vez de trocar de uma vez (o que pareceria um "corte seco")
  acaoAtual.crossFadeTo(novaAcao, 0.4, true);

  acaoAtual = novaAcao;
}

document.querySelectorAll("#botoes button").forEach((botao) => {
  botao.addEventListener("click", () => {
    trocarAnimacao(botao.dataset.nome);

    document.querySelectorAll("#botoes button").forEach(b => b.classList.remove("ativo"));
    botao.classList.add("ativo");
  });
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  const delta = clock.getDelta();
  if (mixer) {
    mixer.update(delta);
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
