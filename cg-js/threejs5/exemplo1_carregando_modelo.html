<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 1: Carregando um Modelo (GLTFLoader)</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
  #status { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; }
</style>
</head>
<body>

<div id="status">Carregando modelo...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Eixos de referência (vermelho=X, verde=Y, azul=Z). Serve de teste: se nem
// isso aparecer, o problema é a cena/câmera, não o modelo.
scene.add(new THREE.AxesHelper(3));

// Modelo estático simples (o "pato" de teste padrão do Khronos Group).
// O material dele vem pronto de dentro do arquivo .glb (um MeshStandardMaterial,
// como quase todo modelo glTF), e por isso PRECISA de luz na cena para aparecer.
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

const loader = new GLTFLoader();

const status = document.getElementById("status");

loader.load(
  "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets/Models/Duck/glTF-Binary/Duck.glb",

  // Callback de SUCESSO: só roda quando o arquivo termina de chegar
  (gltf) => {
    const modelo = gltf.scene;

    // Em vez de "chutar" um valor de escala, medimos o tamanho real do
    // modelo carregado (sua "caixa" envolvente, ou bounding box) e calculamos
    // a escala e a posição automaticamente. Isso funciona para qualquer
    // modelo, sem depender de sabermos de antemão as unidades usadas.
    const caixa = new THREE.Box3().setFromObject(modelo);
    const tamanho = caixa.getSize(new THREE.Vector3());
    const centro = caixa.getCenter(new THREE.Vector3());

    console.log("Tamanho original do modelo:", tamanho);
    console.log("Centro original do modelo:", centro);

    const maiorDimensao = Math.max(tamanho.x, tamanho.y, tamanho.z);
    const escalaAlvo = 2 / maiorDimensao; // queremos que o modelo tenha ~2 unidades no maior eixo
    modelo.scale.setScalar(escalaAlvo);

    // Recalcula o centro DEPOIS de escalar, e desloca o modelo para a origem
    const caixaEscalada = new THREE.Box3().setFromObject(modelo);
    const centroEscalado = caixaEscalada.getCenter(new THREE.Vector3());
    modelo.position.sub(centroEscalado);

    scene.add(modelo);

    status.textContent = "Modelo carregado!";
    setTimeout(() => status.style.display = "none", 1500);
  },

  // Callback de PROGRESSO (opcional): usamos só para atualizar o texto
  (progresso) => {
    if (progresso.total) {
      const percentual = Math.round((progresso.loaded / progresso.total) * 100);
      status.textContent = `Carregando modelo... ${percentual}%`;
    }
  },

  // Callback de ERRO
  (erro) => {
    console.error("Erro ao carregar o modelo:", erro);
    status.textContent = "Erro ao carregar o modelo (veja o console).";
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
