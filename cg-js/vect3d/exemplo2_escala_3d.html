<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 2: Escala no Espaço (3D)</title>
<style>
  body { font-family: sans-serif; background: #222; color: #eee; display: flex; flex-direction: column; align-items: center; }
  canvas { background: white; margin-top: 20px; border: 1px solid #555; }
  .controls { margin-top: 12px; display: flex; gap: 24px; }
  .controls label { display: flex; flex-direction: column; font-size: 14px; }
</style>
</head>
<body>

<h2>Exemplo 2: Escala (pivô = primeiro vértice)</h2>
<canvas id="canvas" width="600" height="400"></canvas>

<div class="controls">
  <label>Sx: <span id="sxValue">1.0</span>
    <input type="range" id="sx" min="0.3" max="2.5" step="0.1" value="1">
  </label>
  <label>Sy: <span id="syValue">1.0</span>
    <input type="range" id="sy" min="0.3" max="2.5" step="0.1" value="1">
  </label>
  <label>Sz: <span id="szValue">1.0</span>
    <input type="range" id="sz" min="0.3" max="2.5" step="0.1" value="1">
  </label>
</div>

<script>
// --- Ponto e transformações (idênticos à página prática da wiki) ---

class Point3D {
  constructor(x, y, z) {
    this.x = x;
    this.y = y;
    this.z = z;
  }
}

function translate(points, tx, ty, tz) {
  for (const p of points) {
    p.x += tx;
    p.y += ty;
    p.z += tz;
  }
}

function scale(points, sx, sy, sz) {
  const pivot = { x: points[0].x, y: points[0].y, z: points[0].z };

  translate(points, -pivot.x, -pivot.y, -pivot.z);
  for (const p of points) {
    p.x *= sx;
    p.y *= sy;
    p.z *= sz;
  }
  translate(points, pivot.x, pivot.y, pivot.z);
}

const DISTANCE = 300;

function project(points) {
  return points.map((p) => ({
    x: (DISTANCE / p.z) * p.x,
    y: (DISTANCE / p.z) * p.y,
  }));
}

// --- Cubo ---

function makeCube() {
  return [
    new Point3D(-50, -50, 250),
    new Point3D(50, -50, 250),
    new Point3D(50, 50, 250),
    new Point3D(-50, 50, 250),
    new Point3D(-50, -50, 350),
    new Point3D(50, -50, 350),
    new Point3D(50, 50, 350),
    new Point3D(-50, 50, 350),
  ];
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

function drawCube(points3D, color) {
  const p = project(points3D);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;

  function line(a, b) {
    ctx.beginPath();
    ctx.moveTo(centerX + a.x, centerY + a.y);
    ctx.lineTo(centerX + b.x, centerY + b.y);
    ctx.stroke();
  }

  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    line(p[i], p[i + 4]);
    line(p[i], p[j]);
    line(p[i + 4], p[j + 4]);
  }
}

function drawPivot(point3D) {
  const [p] = project([point3D]);
  ctx.beginPath();
  ctx.arc(centerX + p.x, centerY + p.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = "black";
  ctx.fill();
  ctx.font = "12px sans-serif";
  ctx.fillText("pivô", centerX + p.x + 6, centerY + p.y - 6);
}

function render() {
  const sx = Number(sxInput.value);
  const sy = Number(syInput.value);
  const sz = Number(szInput.value);
  sxValue.textContent = sx.toFixed(1);
  syValue.textContent = sy.toFixed(1);
  szValue.textContent = sz.toFixed(1);

  const original = makeCube();
  const scaled = makeCube();
  scale(scaled, sx, sy, sz);

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawCube(original, "#bbb");
  drawCube(scaled, "#e63946");
  drawPivot(original[0]);
}

const sxInput = document.getElementById("sx");
const syInput = document.getElementById("sy");
const szInput = document.getElementById("sz");
const sxValue = document.getElementById("sxValue");
const syValue = document.getElementById("syValue");
const szValue = document.getElementById("szValue");

[sxInput, syInput, szInput].forEach((input) => input.addEventListener("input", render));

render();
</script>

</body>
</html>
