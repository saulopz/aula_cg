<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Exemplo 3b: Vetor de Chute + Gravidade</title>
    <style>
      body {
        font-family: sans-serif;
        background: #222;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas {
        background: white;
        margin-top: 20px;
        border: 1px solid #555;
      }
      button {
        margin-top: 10px;
        padding: 6px 14px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Exemplo 3b: Influência da Gravidade no Vetor de Chute</h2>
    <canvas id="canvas" width="800" height="400"></canvas>
    <button id="restart">Reiniciar chute</button>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      class Vector2D {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }
        size() {
          return Math.sqrt(this.x * this.x + this.y * this.y);
        }
        add(other) {
          this.x += other.x;
          this.y += other.y;
          return this;
        }
        static sum(a, b) {
          return new Vector2D(a.x + b.x, a.y + b.y);
        }
      }

      function drawVector(ctx, origin, v, color, label) {
        const scale = 4; // só para a seta ficar visível na tela, não afeta o cálculo
        const endX = origin.x + v.x * scale;
        const endY = origin.y + v.y * scale;

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        const angle = Math.atan2(endY - origin.y, endX - origin.x);
        const headLength = 8;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
          endX - headLength * Math.cos(angle - Math.PI / 6),
          endY - headLength * Math.sin(angle - Math.PI / 6),
        );
        ctx.lineTo(
          endX - headLength * Math.cos(angle + Math.PI / 6),
          endY - headLength * Math.sin(angle + Math.PI / 6),
        );
        ctx.closePath();
        ctx.fill();

        if (label) {
          ctx.font = "12px sans-serif";
          ctx.fillText(label, endX + 4, endY);
        }
      }

      const groundY = 360;
      const gravity = new Vector2D(0, 0.4); // aponta para baixo (Y cresce para baixo no Canvas)

      let ballPos, velocity, trail, running;

      function reset() {
        ballPos = new Vector2D(60, groundY);
        velocity = new Vector2D(6, -11); // "chute": para a direita e para cima
        trail = [new Vector2D(ballPos.x, ballPos.y)];
        running = true;
      }

      function step() {
        // A cada quadro, a gravidade é somada à velocidade (a força do chute vai perdendo pra gravidade)
        velocity.add(gravity);
        ballPos.add(velocity);
        trail.push(new Vector2D(ballPos.x, ballPos.y));

        if (ballPos.y >= groundY) {
          ballPos.y = groundY;
          running = false;
        }
      }

      function draw() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Chão
        ctx.strokeStyle = "#999";
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();

        // Rastro da trajetória
        ctx.strokeStyle = "#aaa";
        ctx.beginPath();
        trail.forEach((p, i) =>
          i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y),
        );
        ctx.stroke();

        // Bola
        ctx.beginPath();
        ctx.arc(ballPos.x, ballPos.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = "black";
        ctx.fill();

        // Vetor velocidade atual (resultado da soma acumulada com a gravidade)
        drawVector(
          ctx,
          { x: ballPos.x, y: ballPos.y },
          velocity,
          "#e63946",
          "velocidade",
        );

        // Vetor gravidade (fixo, sempre puxando para baixo)
        drawVector(
          ctx,
          { x: ballPos.x, y: ballPos.y },
          gravity,
          "#457b9d",
          "gravidade",
        );
      }

      function loop() {
        if (running) step();
        draw();
        requestAnimationFrame(loop);
      }

      document.getElementById("restart").addEventListener("click", reset);

      reset();
      loop();
    </script>
  </body>
</html>
