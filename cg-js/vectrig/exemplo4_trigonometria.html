<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Exemplo 4: Trigonometria e Vetores</title>
    <style>
      body {
        font-family: sans-serif;
        background: #222;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas {
        background: white;
        margin-top: 20px;
        border: 1px solid #555;
      }
      .info {
        margin-top: 10px;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h2>Exemplo 4: Trigonometria (mova o mouse sobre o canvas)</h2>
    <canvas id="canvas" width="500" height="400"></canvas>
    <div class="info" id="info"></div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const info = document.getElementById("info");

      class Vector2D {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }
        size() {
          return Math.sqrt(this.x * this.x + this.y * this.y);
        }
      }

      function toDegrees(radians) {
        return (radians * 180) / Math.PI;
      }

      function drawVector(ctx, origin, v, color) {
        const endX = origin.x + v.x;
        const endY = origin.y + v.y;

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        const angle = Math.atan2(v.y, v.x);
        const headLength = 10;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
          endX - headLength * Math.cos(angle - Math.PI / 6),
          endY - headLength * Math.sin(angle - Math.PI / 6),
        );
        ctx.lineTo(
          endX - headLength * Math.cos(angle + Math.PI / 6),
          endY - headLength * Math.sin(angle + Math.PI / 6),
        );
        ctx.closePath();
        ctx.fill();
      }

      const origin = { x: 250, y: 200 };
      let mouse = { x: 350, y: 130 };

      function draw() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Eixos de referência
        ctx.strokeStyle = "#ddd";
        ctx.beginPath();
        ctx.moveTo(0, origin.y);
        ctx.lineTo(canvas.width, origin.y);
        ctx.moveTo(origin.x, 0);
        ctx.lineTo(origin.x, canvas.height);
        ctx.stroke();

        const v = new Vector2D(mouse.x - origin.x, mouse.y - origin.y);
        drawVector(ctx, origin, v, "#e63946");

        // Vetor a partir de ângulo e magnitude: reconstruindo o mesmo vetor
        // pela fórmula, só para provar que bate com o que o mouse gerou
        const angleRad = Math.atan2(v.y, v.x);
        const size = v.size();
        const rebuilt = new Vector2D(
          Math.cos(angleRad) * size,
          Math.sin(angleRad) * size,
        );
        // (rebuilt é usado só no cálculo de conferência, não é desenhado de novo por cima)

        const angleDeg = toDegrees(angleRad);
        const sin = Math.sin(angleRad);
        const cos = Math.cos(angleRad);
        const tan = Math.tan(angleRad);

        info.innerHTML = `
    Vetor: (${v.x.toFixed(0)}, ${v.y.toFixed(0)}) &nbsp;|&nbsp; Tamanho: ${size.toFixed(1)}<br>
    Ângulo: ${angleDeg.toFixed(1)}° (${angleRad.toFixed(2)} rad)<br>
    sen = ${sin.toFixed(2)} &nbsp; cos = ${cos.toFixed(2)} &nbsp; tan = ${tan.toFixed(2)}
  `;
      }

      canvas.addEventListener("mousemove", (event) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = event.clientX - rect.left;
        mouse.y = event.clientY - rect.top;
        draw();
      });

      draw();
    </script>
  </body>
</html>
