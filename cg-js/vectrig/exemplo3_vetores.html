<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Exemplo 3: Vetores</title>
    <style>
      body {
        font-family: sans-serif;
        background: #222;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas {
        background: white;
        margin-top: 20px;
        border: 1px solid #555;
      }
      .legenda {
        margin-top: 10px;
        font-size: 14px;
      }
      .legenda span {
        padding: 2px 8px;
        margin-right: 10px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h2>Exemplo 3: Vetores (tamanho, soma e normalização)</h2>
    <canvas id="canvas" width="500" height="400"></canvas>
    <div class="legenda">
      <span style="background: #e63946; color: white">Vetor A</span>
      <span style="background: #457b9d; color: white">Vetor B</span>
      <span style="background: #2a9d8f; color: white">A + B</span>
      <span style="background: #e9c46a">
        A normalizado (escala x60 para visualização)
      </span>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      // --- Classe Vector2D ---
      class Vector2D {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }

        size() {
          return Math.sqrt(this.x * this.x + this.y * this.y);
        }

        add(other) {
          this.x += other.x;
          this.y += other.y;
          return this;
        }

        static sum(a, b) {
          return new Vector2D(a.x + b.x, a.y + b.y);
        }

        multiply(scalar) {
          this.x *= scalar;
          this.y *= scalar;
          return this;
        }

        normalize() {
          const s = this.size();
          return new Vector2D(this.x / s, this.y / s);
        }
      }

      // --- Desenha um vetor como uma seta, partindo de um ponto de origem ---
      function drawVector(ctx, origin, v, color, label) {
        const endX = origin.x + v.x;
        const endY = origin.y + v.y;

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;

        // Linha principal
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // Ponta da seta
        const angle = Math.atan2(v.y, v.x);
        const headLength = 10;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
          endX - headLength * Math.cos(angle - Math.PI / 6),
          endY - headLength * Math.sin(angle - Math.PI / 6),
        );
        ctx.lineTo(
          endX - headLength * Math.cos(angle + Math.PI / 6),
          endY - headLength * Math.sin(angle + Math.PI / 6),
        );
        ctx.closePath();
        ctx.fill();

        // Rótulo com o tamanho do vetor
        ctx.font = "13px sans-serif";
        ctx.fillText(`${label} (tam: ${v.size().toFixed(1)})`, endX + 6, endY);
      }

      function draw() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const origin = { x: 60, y: 340 };

        const a = new Vector2D(180, -120);
        const b = new Vector2D(90, -40);
        const sum = Vector2D.sum(a, b);

        drawVector(ctx, origin, a, "#e63946", "A");
        drawVector(ctx, origin, b, "#457b9d", "B");
        drawVector(ctx, origin, sum, "#2a9d8f", "A+B");

        // Vetor normalizado (multiplicado por 60 só para dar pra enxergar,
        // já que o tamanho real dele é 1)
        const aNormalized = a.normalize().multiply(60);
        drawVector(ctx, origin, aNormalized, "#e9c46a", "A norm.");
      }

      draw();
    </script>
  </body>
</html>
