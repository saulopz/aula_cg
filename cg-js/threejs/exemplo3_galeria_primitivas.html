<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 3: Galeria de Primitivas</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 4, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const material = new THREE.MeshNormalMaterial();

// Cada primitiva, com sua geometria e uma posição diferente para não sobrepor
const primitives = [
  { geometry: new THREE.BoxGeometry(1.2, 1.2, 1.2), x: -6 },
  { geometry: new THREE.SphereGeometry(0.8, 32, 16), x: -3.5 },
  { geometry: new THREE.ConeGeometry(0.8, 1.5, 32), x: -1 },
  { geometry: new THREE.CylinderGeometry(0.7, 0.7, 1.5, 32), x: 1.5 },
  { geometry: new THREE.TorusGeometry(0.7, 0.3, 16, 48), x: 4 },
  { geometry: new THREE.PlaneGeometry(1.5, 1.5), x: 6.5 },
];

const meshes = primitives.map(({ geometry, x }) => {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.x = x;
  scene.add(mesh);
  return mesh;
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // Gira todas as primitivas devagar, só para ver as faces de cada uma
  meshes.forEach((mesh) => {
    mesh.rotation.x += 0.005;
    mesh.rotation.y += 0.01;
  });
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
