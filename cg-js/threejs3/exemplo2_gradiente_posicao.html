<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 2: Gradiente por Posição</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(2, 2, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const material = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vPosition; // "varying": calculado por vértice, interpolado por pixel

    void main() {
      vPosition = position; // guarda a posição ORIGINAL do vértice (antes de mover a malha)
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPosition; // mesmo nome/tipo: aqui já chega interpolado, pixel a pixel

    void main() {
      // A geometria vai de -1 a 1 em cada eixo (aproximadamente).
      // Transformamos isso em uma cor válida (0.0 a 1.0):
      vec3 color = vPosition * 0.5 + 0.5;
      gl_FragColor = vec4(color, 1.0);
    }
  `,
});

const geometry = new THREE.SphereGeometry(1.5, 64, 64);
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  mesh.rotation.y += 0.003;
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
