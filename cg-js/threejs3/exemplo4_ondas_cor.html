<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 4: Ondas de Cor</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(3, 3, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Este shader combina os três conceitos da aula:
// - varying (vPosition): a posição de cada pixel na superfície
// - uniform (uTime): o "relógio" vindo do JavaScript
// - sin/cos: a mesma trigonometria já usada nas aulas de vetores
const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
  },
  vertexShader: `
    varying vec3 vPosition;

    void main() {
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vPosition;

    void main() {
      // Uma onda que se propaga ao longo de X, deslocada no tempo por uTime
      float onda = sin(vPosition.x * 4.0 + uTime * 2.0);
      float brilho = onda * 0.5 + 0.5;

      // Combina duas cores usando o brilho da onda como mistura (mix)
      vec3 corA = vec3(0.1, 0.3, 0.9); // azul
      vec3 corB = vec3(1.0, 0.6, 0.1); // laranja
      vec3 cor = mix(corA, corB, brilho);

      gl_FragColor = vec4(cor, 1.0);
    }
  `,
});

const geometry = new THREE.PlaneGeometry(4, 4, 64, 64);
const mesh = new THREE.Mesh(geometry, material);
mesh.rotation.x = -Math.PI / 3; // inclina o plano para ver melhor o efeito
scene.add(mesh);

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  material.uniforms.uTime.value += 0.02;

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
