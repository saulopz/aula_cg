<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 1: Cor Sólida (Shader Mínimo)</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(2, 2, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// O shader mais simples possível: nenhuma luz, nenhuma textura,
// nenhuma variação, só uma cor fixa saindo do fragment shader.
const material = new THREE.ShaderMaterial({
  vertexShader: `
    void main() {
      // gl_Position é a posição final do vértice na tela.
      // projectionMatrix (câmera) e modelViewMatrix (posição/rotação/escala
      // do objeto) já vêm prontas do Three.js.
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    void main() {
      // gl_FragColor é a cor final do pixel: (R, G, B, alfa), cada um de 0.0 a 1.0
      gl_FragColor = vec4(1.0, 0.4, 0.0, 1.0); // laranja sólido
    }
  `,
});

const geometry = new THREE.TorusKnotGeometry(1, 0.3, 128, 32);
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  mesh.rotation.y += 0.003;
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
