<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 3b: Textura a partir de uma Imagem (TextureLoader)</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
  #info { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; line-height: 1.5; }
  #erro { color: #ff8888; display: none; margin-top: 8px; max-width: 420px; }
</style>
</head>
<body>

<div id="info">
  Cubo: <b>tijolos.jpg</b> &nbsp;|&nbsp; Esfera: <b>grade_uv.png</b>
  <div id="erro"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 6, 5);
scene.add(sun);

// ---------------------------------------------------------------------
// TextureLoader: carrega uma imagem de um ARQUIVO (como o GLTFLoader faz
// com modelos). Os arquivos tijolos.jpg e grade_uv.png precisam estar na
// mesma pasta deste .html.
//
// .load(url, aoCarregar, aoProgredir, aoErrar):
//   - devolve a textura IMEDIATAMENTE (vazia, a imagem ainda está chegando)
//     e já podemos usá-la no material; ela aparece quando o download termina.
//   - a função "aoErrar" roda quando a imagem NÃO consegue ser carregada
//     (arquivo não encontrado, nome errado, ou página aberta direto do disco
//     com file://, caso em que o navegador bloqueia imagens locais).
// ---------------------------------------------------------------------
const loader = new THREE.TextureLoader();
const erro = document.getElementById("erro");

const falhas = []; // nomes das imagens que não carregaram
function registrarFalha(nome) {
  falhas.push(nome);
  erro.style.display = "block";
  erro.textContent =
    `Não foi possível carregar: ${falhas.join(", ")}. ` +
    `Confira se os arquivos estão na mesma pasta do .html. Se estiverem, o motivo provável é ` +
    `abrir o arquivo direto do disco (file://): o navegador bloqueia imagens locais usadas como ` +
    `textura. Abra por um servidor local (extensão Live Server / Five Server).`;
}

const texTijolos = loader.load("tijolos.jpg", undefined, undefined, () => registrarFalha("tijolos.jpg"));
const texGrade = loader.load("grade_uv.png", undefined, undefined, () => registrarFalha("grade_uv.png"));

// Imagens de COR (fotos, desenhos) são guardadas em sRGB. Avisamos isso ao
// Three.js para ele converter corretamente na hora de calcular a luz. Sem
// esta linha as cores ficam "lavadas" (mais claras e desbotadas que a imagem).
texTijolos.colorSpace = THREE.SRGBColorSpace;
texGrade.colorSpace = THREE.SRGBColorSpace;

// --- Cubo com a textura de tijolos ---
const cubo = new THREE.Mesh(
  new THREE.BoxGeometry(2, 2, 2),
  new THREE.MeshStandardMaterial({ map: texTijolos, roughness: 0.9 })
);
cubo.position.x = -2;
scene.add(cubo);

// --- Esfera com a grade UV: mostra como a imagem é "enrolada" na geometria ---
const esfera = new THREE.Mesh(
  new THREE.SphereGeometry(1.3, 48, 32),
  new THREE.MeshStandardMaterial({ map: texGrade, roughness: 0.6 })
);
esfera.position.x = 2;
scene.add(esfera);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  cubo.rotation.y += 0.004;
  esfera.rotation.y += 0.004;
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
