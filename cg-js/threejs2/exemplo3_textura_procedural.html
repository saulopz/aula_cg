<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 3: Textura Procedural (Tabuleiro de Xadrez)</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(3, 3, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(4, 6, 4);
scene.add(sun);

// ---------------------------------------------------------------------
// Gerando uma textura de tabuleiro de xadrez SEM depender de nenhuma
// imagem externa: desenhamos num <canvas> escondido, com o mesmo
// contexto 2D que já usamos nas aulas de filtros e transformações
// matriciais, e entregamos esse canvas pronto para o Three.js usar
// como se fosse uma imagem carregada de um arquivo.
// ---------------------------------------------------------------------
function createCheckerTexture(size = 256, squares = 8) {
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  const squareSize = size / squares;
  for (let row = 0; row < squares; row++) {
    for (let col = 0; col < squares; col++) {
      const isLight = (row + col) % 2 === 0;
      ctx.fillStyle = isLight ? "#eeeeee" : "#333333";
      ctx.fillRect(col * squareSize, row * squareSize, squareSize, squareSize);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

const checkerTexture = createCheckerTexture();
checkerTexture.repeat.set(2, 2); // repete o tabuleiro 2x2 vezes sobre a superfície

const geometry = new THREE.BoxGeometry(2, 2, 2);
const material = new THREE.MeshStandardMaterial({ map: checkerTexture, roughness: 0.6 });
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

// "Chão" também usando a mesma textura, repetida mais vezes (superfície maior)
const floorTexture = createCheckerTexture();
floorTexture.wrapS = THREE.RepeatWrapping;
floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(6, 6);

const floorGeometry = new THREE.PlaneGeometry(20, 20);
const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2; // deita o plano na horizontal
floor.position.y = -1.5;
scene.add(floor);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  cube.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
