<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 4: Sliders de Luz e Material</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
  .panel {
    position: absolute; top: 10px; left: 10px; color: #eee;
    background: rgba(0,0,0,0.5); padding: 12px 16px; border-radius: 6px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center;
    font-size: 13px;
  }
  .panel span { text-align: right; min-width: 34px; }
</style>
</head>
<body>

<div class="panel">
  <label>Ambient</label><input type="range" id="ambient" min="0" max="1" step="0.05" value="0.3"><span id="ambientValue">0.3</span>
  <label>Direcional</label><input type="range" id="directional" min="0" max="2" step="0.05" value="1"><span id="directionalValue">1.0</span>
  <label>Roughness</label><input type="range" id="roughness" min="0" max="1" step="0.05" value="0.5"><span id="roughnessValue">0.5</span>
  <label>Metalness</label><input type="range" id="metalness" min="0" max="1" step="0.05" value="0.2"><span id="metalnessValue">0.2</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const ambient = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(4, 6, 4);
scene.add(sun);

const geometry = new THREE.SphereGeometry(1.3, 48, 48);
const material = new THREE.MeshStandardMaterial({ color: 0x3399ff, roughness: 0.5, metalness: 0.2 });
const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

// --- Conecta cada slider à propriedade correspondente da luz/material ---

function bindSlider(id, valueId, onChange) {
  const input = document.getElementById(id);
  const valueEl = document.getElementById(valueId);
  const update = () => {
    const value = Number(input.value);
    valueEl.textContent = value.toFixed(2);
    onChange(value);
  };
  input.addEventListener("input", update);
  update();
}

bindSlider("ambient", "ambientValue", (v) => (ambient.intensity = v));
bindSlider("directional", "directionalValue", (v) => (sun.intensity = v));
bindSlider("roughness", "roughnessValue", (v) => (material.roughness = v));
bindSlider("metalness", "metalnessValue", (v) => (material.metalness = v));

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
